<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>♛ Milena's Weather App ♛</title>
</head>

<body>
    <div class="container">
        <div class="weather-app-wrapper">
            <div class="weather-app">
                <form id="search-form" class="mb-3">
                    <div class="row">
                       <div class="col-9">
    <!-- 1. Added list="city-suggestions" here -->
    <input type="search" placeholder="Type a city" class="form-control" id="city-input"
        autocomplete="off" list="city-suggestions" />
    
    <!-- 2. Added the datalist element here -->
    <datalist id="city-suggestions"></datalist>
</div>
                        <div class="col-3">
                            <input type="submit" value="Search" class="btn btn-primary w-100" />
                        </div>
                    </div>
                </form>
               <div class="overview">
    <h1 id="city"></h1>
    <ul>
        <li>Local time: <span id="local-time"></span></li> <!-- NEW LINE -->
        <li>Last updated: <span id="date"></span></li>
        <li id="description"></li>
    </ul>
</div>
                <div class="row">
                    <div class="col-6">
                        <div class="clearfix weather-temperature">
                            <img src="" alt="Partly Cloudy" id="icon" class="float-left" />
                            <div class="float-left">
                                <strong id="temperature"></strong>
                                <span class="units"><a href="#" id="celsius-link" class="active">°C</a> |
                                    <a href="#" id="farenheit-link">°F</a>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <ul>
                            <li>Humidity: <span id="humidity">
                                </span>%</li>
                            <li>Wind: <span id="wind">
                                </span>km/h</li>
                        </ul>
                    </div>
                </div>
                <div class="weather-forecast" id="forecast">
                </div>
                <!-- NEW WEATHER RADIO SECTION -->
<div class="weather-radio mt-4 p-3 text-center" style="background: #f8f9fa; border-radius: 15px;">
    <h5>📻 Weather Radio</h5>
    <select id="station-select" class="form-control mb-3">
        <option value="https://play.streamafrica.net/lofi">Chill Lo-Fi Beats</option>
        <option value="https://media-ssl.musicradio.com/CapitalUK">Capital FM (Pop)</option>
        <option value="https://live.mpr.org/mprcmp3">Classical Music</option>
    </select>
    <audio id="audio-player" controls style="width: 100%; height: 35px;">
        <source src="https://play.streamafrica.net/lofi" type="audio/mpeg">
    </audio>
</div>
                <small>
                    <a href="https://github.com/kettama/milly-vanilla-weather-app" target="_blank">Open-source code</a>
                    by Milena Obilinovic
                </small>
            </div>
        </div>
        <script src="src/app.js"></script>
</body>

</html>
