<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>♛ Milena's Magic Radio ♛</title>
</head>

<body>
    <div class="container">
        <div class="weather-app-wrapper">
            <div class="weather-app">
                <!-- Search Section with Suggestions -->
                <form id="search-form" class="mb-3">
                    <div class="row">
                        <div class="col-9">
                            <input type="search" placeholder="Type a city" class="form-control" id="city-input"
                                autocomplete="off" list="city-suggestions" />
                            <datalist id="city-suggestions"></datalist>
                        </div>
                        <div class="col-3">
                            <input type="submit" value="Search" class="btn btn-primary w-100" />
                        </div>
                    </div>
                </form>

                <!-- Weather Overview -->
                <div class="overview">
                    <h1 id="city"></h1>
                    <ul>
                        <li>Local time: <span id="local-time"></span></li>
                        <li>Last updated: <span id="date"></span></li>
                        <li id="description"></li>
                    </ul>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="clearfix weather-temperature">
                            <img src="" alt="Partly Cloudy" id="icon" class="float-left" />
                            <div class="float-left">
                                <strong id="temperature"></strong>
                                <span class="units"><a href="#" id="celsius-link" class="active">°C</a> |
                                    <a href="#" id="farenheit-link">°F</a>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <ul>
                            <li>Humidity: <span id="humidity"></span>%</li>
                            <li>Wind: <span id="wind"></span>km/h</li>
                        </ul>
                    </div>
                </div>

                <!-- 6-Day Emoji Forecast -->
                <div class="weather-forecast" id="forecast">
                </div>
<!-- GLOBAL & CHILEAN RADIO SECTION -->
<div class="weather-radio mt-4 p-3 text-center" style="background: #f8f9fa; border-radius: 15px;">
    <h5>📻 Weather Radio</h5>
    <select id="station-select" class="form-control mb-3">
        <!-- Global Stations -->
        <option value="https://lofi.stream.laut.fm/lofi">Chill Lo-Fi Beats</option>
        <option value="https://listen.181fm.com/181-power_128k.mp3">Global Pop Hits</option>
        <option value="https://stream.wqxr.org/wqxr">New York Classical (WQXR)</option>
        
        <!-- Regional Antofagasta Stations -->
        <option value="https://us9.maindigitalstream.com/ssl/7389">Radio Sol 97.7 (Antofagasta)</option>
        <option value="https://unlimited1-cl.dps.live/madero_antofagasta/mp3/icecast.audio">Radio Madero (Antofagasta)</option>
        <option value="https://sonando.us.digitalproserver.com/canal95.mp3">Canal 95 88.1 (Antofagasta)</option>
        
        <!-- Univ. Antofagasta (Uses raw IP - browser may block if strict) -->
        <option value="http://185.105.4.100/proxy/radioua?mp=/stream">Radio Universidad (Antofagasta)</option>
        
        <!-- National News Network -->
        <option value="https://unlimited3-cl.dps.live/biobiosantiago/mp3/icecast.audio">Radio Bío Bío (Santiago)</option>
    </select>
    
    <audio id="audio-player" controls style="width: 100%; height: 35px;">
        <source src="https://lofi.stream.laut.fm/lofi" type="audio/mpeg">
    </audio>
</div>
                <!-- NEW: City News Feed -->
        <!-- NEW: World News Feed -->
<div class="weather-news mt-4 p-3 text-center" style="background: #f8f9fa; border-radius: 15px;">
    <h5>📰 Top World Headlines</h5>
    <ul id="news-list" style="list-style-type: none; padding: 0; margin: 0;">
        <li style="font-size: 14px;">Loading world news...</li>
    </ul>
</div>
                <small class="d-block mt-4 text-center">
                    <a href="https://github.com/kettama/milly-vanilla-weather-app" target="_blank">Open-source code</a>
                    by Milena Obilinovic
                </small>
            </div>
        </div>
    </div>
    <script src="src/app.js"></script>
</body>

</html>
